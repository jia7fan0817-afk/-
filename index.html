<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>隐遇 · 已婚女性专属</title>
<style>
  :root {
    --bg: #0b0b0f;
    --card: #16161c;
    --pink: #ff2d55;
    --pink2: #ff6b8a;
    --text: #f5f5f7;
    --muted: #8e8e93;
    --border: #2c2c34;
    --green: #30d158;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  .app { max-width: 430px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; position: relative; }

  /* 登录 */
  #login {
    position: absolute; inset: 0; background: var(--bg); z-index: 200;
    display: flex; flex-direction: column; justify-content: center; padding: 32px;
  }
  #login.hidden { display: none; }
  .logo { font-size: 2.6rem; font-weight: 800; color: var(--pink); text-align: center; margin-bottom: 6px; }
  .sub { text-align: center; color: var(--muted); margin-bottom: 36px; font-size: 0.95rem; line-height: 1.5; }
  input, textarea {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px; color: var(--text); font-size: 1rem; margin-bottom: 12px;
  }
  .btn {
    width: 100%; background: var(--pink); color: white; border: none;
    padding: 16px; border-radius: 14px; font-size: 1.05rem; font-weight: 600; cursor: pointer;
  }
  .btn:active { opacity: 0.9; }

  /* 顶部 */
  .header {
    padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border); background: var(--bg);
  }
  .header .title { font-weight: 700; font-size: 1.2rem; color: var(--pink); }

  /* 底部导航 */
  .tabbar {
    display: flex; border-top: 1px solid var(--border); background: var(--card);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1; text-align: center; padding: 10px 0 8px; font-size: 0.75rem; color: var(--muted); cursor: pointer;
  }
  .tab.active { color: var(--pink); }
  .tab span { display: block; font-size: 1.4rem; margin-bottom: 2px; }

  /* 页面 */
  .page { flex: 1; overflow-y: auto; display: none; }
  .page.active { display: block; }

  /* 发现页 - 卡片 */
  #discover { position: relative; overflow: hidden; }
  .card-stack { height: calc(100% - 20px); position: relative; padding: 12px; }
  .man-card {
    position: absolute; inset: 12px; background: var(--card); border-radius: 20px;
    overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    display: flex; flex-direction: column;
  }
  .man-photo {
    height: 58%; background: #222; position: relative;
    display: flex; align-items: center; justify-content: center; font-size: 5rem;
  }
  .man-info { padding: 16px; flex: 1; overflow-y: auto; }
  .man-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
  .man-meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 10px; }
  .man-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tag { background: rgba(255,45,85,0.15); color: var(--pink2); padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; }
  .man-desc { font-size: 0.95rem; line-height: 1.5; color: #ddd; }
  .actions {
    position: absolute; bottom: 30px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 28px; z-index: 10;
  }
  .action-btn {
    width: 64px; height: 64px; border-radius: 50%; border: none; font-size: 1.8rem;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  .btn-no { background: #2c2c34; color: #ff3b30; }
  .btn-yes { background: var(--pink); color: white; }

  /* 动态 */
  .post { background: var(--card); margin: 12px; border-radius: 16px; padding: 16px; }
  .post-header { display: flex; gap: 12px; margin-bottom: 10px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .post-content { white-space: pre-wrap; margin-bottom: 10px; line-height: 1.5; }
  .post-img { width: 100%; border-radius: 12px; margin-top: 8px; max-height: 300px; object-fit: cover; }
  .post-actions { display: flex; gap: 20px; color: var(--muted); font-size: 0.9rem; margin-top: 10px; }
  .post-actions span { cursor: pointer; }
  .comments { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .comment { font-size: 0.9rem; margin-bottom: 8px; }
  .comment strong { color: var(--pink2); }

  /* 消息列表 */
  .chat-item {
    display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .chat-item:active { background: #1c1c22; }
  .chat-info { flex: 1; }
  .chat-name { font-weight: 600; margin-bottom: 3px; }
  .chat-last { color: var(--muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 私聊窗口 */
  #chatWindow {
    position: absolute; inset: 0; background: var(--bg); z-index: 150;
    display: none; flex-direction: column;
  }
  #chatWindow.show { display: flex; }
  .chat-header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .back { font-size: 1.4rem; cursor: pointer; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; }
  .msg.me { align-self: flex-end; background: var(--pink); color: white; border-bottom-right-radius: 4px; }
  .msg.other { align-self: flex-start; background: var(--card); border-bottom-left-radius: 4px; }
  .chat-input {
    padding: 10px 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; background: var(--card);
  }
  .chat-input input { margin: 0; flex: 1; }
  .chat-input button { width: auto; padding: 0 18px; border-radius: 12px; }

  /* 匹配成功弹窗 */
  #matchModal {
    position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 300;
    display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px;
  }
  #matchModal.show { display: flex; }
  .match-title { font-size: 2rem; font-weight: 800; color: var(--pink); margin-bottom: 20px; }
  .match-photos { display: flex; gap: 20px; margin-bottom: 30px; }
  .match-photo { width: 100px; height: 100px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; border: 3px solid var(--pink); }
</style>
</head>
<body>
<div class="app">
  <!-- 登录 -->
  <div id="login">
    <div class="logo">隐遇</div>
    <div class="sub">仅限已婚女性<br>认识高质量已婚男性</div>
    <input id="nickname" placeholder="你的昵称（如：小雅32）" maxlength="12">
    <input id="city" placeholder="所在城市">
    <input id="age" type="number" placeholder="年龄" min="25" max="50">
    <button class="btn" onclick="doLogin()">进入隐遇</button>
  </div>

  <!-- 主界面 -->
  <div class="header">
    <div class="title">隐遇</div>
    <div id="userName" style="font-size:0.9rem;color:var(--muted)"></div>
  </div>

  <!-- 发现 -->
  <div id="discover" class="page active">
    <div class="card-stack" id="cardStack"></div>
    <div class="actions">
      <button class="action-btn btn-no" onclick="swipe(false)">✕</button>
      <button class="action-btn btn-yes" onclick="swipe(true)">♥</button>
    </div>
  </div>

  <!-- 动态 -->
  <div id="feed" class="page">
    <div style="padding:12px;">
      <textarea id="postText" placeholder="分享你的想法或欲望（支持露骨）..." rows="3"></textarea>
      <input type="file" id="postImg" accept="image/*" style="margin:8px 0;color:var(--muted);font-size:0.85rem;">
      <button class="btn" style="padding:12px;" onclick="publishPost()">发布动态</button>
    </div>
    <div id="feedList"></div>
  </div>

  <!-- 消息 -->
  <div id="messages" class="page">
    <div id="chatList"></div>
  </div>

  <!-- 我的 -->
  <div id="profile" class="page" style="padding:20px;">
    <div style="text-align:center;margin-bottom:30px;">
      <div class="avatar" style="width:80px;height:80px;margin:0 auto 12px;font-size:1.8rem;" id="myAvatar"></div>
      <div style="font-size:1.3rem;font-weight:700;" id="myName"></div>
      <div style="color:var(--muted);margin-top:4px;">已婚女性</div>
    </div>
    <button class="btn" style="background:#333;" onclick="logout()">退出登录</button>
  </div>

  <!-- 底部导航 -->
  <div class="tabbar">
    <div class="tab active" onclick="switchTab('discover')"><span>🔥</span>发现</div>
    <div class="tab" onclick="switchTab('feed')"><span>📝</span>动态</div>
    <div class="tab" onclick="switchTab('messages')"><span>💬</span>消息</div>
    <div class="tab" onclick="switchTab('profile')"><span>👤</span>我的</div>
  </div>

  <!-- 私聊窗口 -->
  <div id="chatWindow">
    <div class="chat-header">
      <div class="back" onclick="closeChat()">←</div>
      <div id="chatWith" style="font-weight:600;"></div>
    </div>
    <div class="messages" id="msgList"></div>
    <div class="chat-input">
      <input id="msgInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="btn" onclick="sendMsg()">发送</button>
    </div>
  </div>

  <!-- 匹配成功 -->
  <div id="matchModal">
    <div class="match-title">匹配成功！</div>
    <div class="match-photos">
      <div class="match-photo" id="matchMe"></div>
      <div class="match-photo" id="matchHim"></div>
    </div>
    <button class="btn" style="max-width:260px;" onclick="startChatFromMatch()">开始聊天</button>
    <div style="margin-top:16px;color:var(--muted);cursor:pointer;" onclick="closeMatch()">继续浏览</div>
  </div>
</div>

<script>
const MEN = [
  { id:1, name:"陈先生", age:38, city:"上海", job:"金融高管", tags:["有房有车","会照顾人","强势"], desc:"已婚，平时工作忙，想找一个懂事、会撒娇、能接受地下关系的女性。我比较强势，喜欢主导。", emoji:"👨‍💼" },
  { id:2, name:"王总", age:42, city:"北京", job:"上市公司董事", tags:["成熟稳重","会玩","出手阔绰"], desc:"有自己的生活圈，不喜欢麻烦。想找个性感、开放、会玩的已婚女性，私下见面。", emoji:"👔" },
  { id:3, name:"刘医生", age:36, city:"广州", job:"三甲医院主任", tags:["干净卫生","温柔但床上凶"], desc:"白天温文尔雅，晚上想释放。喜欢听话、会叫的女人。可以长期保持联系。", emoji:"🩺" },
  { id:4, name:"张律师", age:40, city:"深圳", job:"高级合伙人", tags:["逻辑强","控制欲","高智商"], desc:"喜欢有点智商又骚的女人。可以聊天解压，也可以约。已婚，注意分寸。", emoji:"⚖️" },
  { id:5, name:"赵先生", age:45, city:"杭州", job:"科技公司CEO", tags:["有钱有闲","会调教","经验丰富"], desc:"见过太多人，想找真正合拍的。可以慢慢培养感情，也可以直接开房。", emoji:"💼" },
  { id:6, name:"孙总", age:39, city:"成都", job:"地产老板", tags:["豪爽","体力好","喜欢主动的"], desc:"喜欢主动一点的女人。不要太矜持，喜欢就直接说。我时间比较自由。", emoji:"🏠" }
];

let currentUser = null;
let currentIndex = 0;
let matches = [];
let chats = {};
let posts = [];
let currentChatId = null;
let lastMatched = null;

function init() {
  const saved = localStorage.getItem('yinyu_user');
  if (saved) {
    currentUser = JSON.parse(saved);
    matches = JSON.parse(localStorage.getItem('yinyu_matches') || '[]');
    chats = JSON.parse(localStorage.getItem('yinyu_chats') || '{}');
    posts = JSON.parse(localStorage.getItem('yinyu_posts') || 'null') || getSeedPosts();
    showApp();
  }
}

function getSeedPosts() {
  return [
    { id:1, user:"陈先生·上海", content:"最近工作压力大，想找个能听我说话，也能让我放松的女人。最好会一点情趣。", time:"2小时前", likes:12, comments:[{user:"小雅",text:"可以聊聊"}] },
    { id:2, user:"王总·北京", content:"有没有周末有空的？想约个吃饭，然后看情况。我比较直接。", time:"5小时前", likes:8, comments:[] },
    { id:3, user:"刘医生·广州", content:"夜班刚结束，有点想找人说说话。或者做点别的。", time:"昨天", likes:15, comments:[{user:"温柔姐",text:"医生好"}] }
  ];
}

function doLogin() {
  const name = document.getElementById('nickname').value.trim();
  const city = document.getElementById('city').value.trim();
  const age = document.getElementById('age').value;
  if (!name || !city || !age) return alert('请填写完整');
  currentUser = { name, city, age, emoji: name[0] };
  localStorage.setItem('yinyu_user', JSON.stringify(currentUser));
  posts = getSeedPosts();
  localStorage.setItem('yinyu_posts', JSON.stringify(posts));
  showApp();
}

function showApp() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('userName').textContent = currentUser.name;
  document.getElementById('myName').textContent = currentUser.name;
  document.getElementById('myAvatar').textContent = currentUser.name[0];
  renderCard();
  renderFeed();
  renderChatList();
}

function logout() {
  localStorage.clear();
  location.reload();
}

function switchTab(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  event.currentTarget.classList.add('active');
  if (name === 'messages') renderChatList();
  if (name === 'feed') renderFeed();
}

function renderCard() {
  const stack = document.getElementById('cardStack');
  if (currentIndex >= MEN.length) {
    stack.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);">暂时没有更多了<br>过段时间再来</div>';
    return;
  }
  const m = MEN[currentIndex];
  stack.innerHTML = `
    <div class="man-card">
      <div class="man-photo">${m.emoji}</div>
      <div class="man-info">
        <div class="man-name">${m.name} <span style="font-size:1.1rem;font-weight:500;">${m.age}</span></div>
        <div class="man-meta">${m.city} · ${m.job}</div>
        <div class="man-tags">${m.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div class="man-desc">${m.desc}</div>
      </div>
    </div>
  `;
}

function swipe(like) {
  if (currentIndex >= MEN.length) return;
  const man = MEN[currentIndex];
  if (like) {
    // 模拟对方也喜欢你（高概率匹配）
    if (Math.random() > 0.3) {
      matches.push(man);
      lastMatched = man;
      if (!chats[man.id]) chats[man.id] = [];
      localStorage.setItem('yinyu_matches', JSON.stringify(matches));
      localStorage.setItem('yinyu_chats', JSON.stringify(chats));
      showMatch(man);
    }
  }
  currentIndex++;
  renderCard();
}

function showMatch(man) {
  document.getElementById('matchMe').textContent = currentUser.name[0];
  document.getElementById('matchHim').textContent = man.emoji;
  document.getElementById('matchModal').classList.add('show');
}

function closeMatch() {
  document.getElementById('matchModal').classList.remove('show');
}

function startChatFromMatch() {
  closeMatch();
  openChat(lastMatched.id);
}

function renderFeed() {
  const list = document.getElementById('feedList');
  list.innerHTML = posts.map(p => `
    <div class="post">
      <div class="post-header">
        <div class="avatar">${p.user[0]}</div>
        <div>
          <div style="font-weight:600;">${p.user}</div>
          <div style="font-size:0.8rem;color:var(--muted);">${p.time}</div>
        </div>
      </div>
      <div class="post-content">${escapeHtml(p.content)}</div>
      ${p.image ? `<img class="post-img" src="${p.image}">` : ''}
      <div class="post-actions">
        <span onclick="likePost(${p.id})">❤️ ${p.likes}</span>
        <span onclick="toggleComments(${p.id})">💬 ${p.comments.length}</span>
      </div>
      <div class="comments" id="cmt-${p.id}" style="display:none;">
        ${p.comments.map(c => `<div class="comment"><strong>${c.user}</strong>：${escapeHtml(c.text)}</div>`).join('')}
        <input placeholder="写评论..." id="cmtInput-${p.id}" style="margin-top:8px;" onkeydown="if(event.key==='Enter')addComment(${p.id})">
      </div>
    </div>
  `).join('');
}

function publishPost() {
  const text = document.getElementById('postText').value.trim();
  const file = document.getElementById('postImg').files[0];
  if (!text && !file) return alert('写点什么吧');
  const post = {
    id: Date.now(),
    user: currentUser.name + '·' + currentUser.city,
    content: text,
    time: '刚刚',
    likes: 0,
    comments: [],
    image: null
  };
  if (file) {
    const reader = new FileReader();
    reader.onload = e => {
      post.image = e.target.result;
      posts.unshift(post);
      savePosts();
      renderFeed();
      document.getElementById('postText').value = '';
      document.getElementById('postImg').value = '';
    };
    reader.readAsDataURL(file);
  } else {
    posts.unshift(post);
    savePosts();
    renderFeed();
    document.getElementById('postText').value = '';
  }
}

function savePosts() {
  localStorage.setItem('yinyu_posts', JSON.stringify(posts));
}

function likePost(id) {
  const p = posts.find(x => x.id === id);
  if (p) { p.likes++; savePosts(); renderFeed(); }
}

function toggleComments(id) {
  const el = document.getElementById('cmt-' + id);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function addComment(id) {
  const input = document.getElementById('cmtInput-' + id);
  const text = input.value.trim();
  if (!text) return;
  const p = posts.find(x => x.id === id);
  p.comments.push({ user: currentUser.name, text });
  savePosts();
  renderFeed();
  document.getElementById('cmt-' + id).style.display = 'block';
}

function renderChatList() {
  const list = document.getElementById('chatList');
  if (matches.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--muted);">还没有匹配<br>去发现页滑动吧</div>';
    return;
  }
  list.innerHTML = matches.map(m => {
    const msgs = chats[m.id] || [];
    const last = msgs.length ? msgs[msgs.length-1].text : '匹配成功，打个招呼吧';
    return `
      <div class="chat-item" onclick="openChat(${m.id})">
        <div class="avatar">${m.emoji}</div>
        <div class="chat-info">
          <div class="chat-name">${m.name}</div>
          <div class="chat-last">${last}</div>
        </div>
      </div>
    `;
  }).join('');
}

function openChat(id) {
  currentChatId = id;
  const man = MEN.find(m => m.id === id) || matches.find(m => m.id === id);
  document.getElementById('chatWith').textContent = man.name;
  document.getElementById('chatWindow').classList.add('show');
  renderMessages();
}

function closeChat() {
  document.getElementById('chatWindow').classList.remove('show');
  currentChatId = null;
  renderChatList();
}

function renderMessages() {
  const list = document.getElementById('msgList');
  const msgs = chats[currentChatId] || [];
  list.innerHTML = msgs.map(m => `
    <div class="msg ${m.from === 'me' ? 'me' : 'other'}">${escapeHtml(m.text)}</div>
  `).join('');
  list.scrollTop = list.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentChatId) return;
  if (!chats[currentChatId]) chats[currentChatId] = [];
  chats[currentChatId].push({ from: 'me', text });
  // 模拟对方回复
  setTimeout(() => {
    const replies = ['你好呀', '在呢', '周末有空吗', '想你了', '发张照片我看看', '今晚方便吗', '我比较直接，你呢'];
    chats[currentChatId].push({ from: 'other', text: replies[Math.floor(Math.random()*replies.length)] });
    localStorage.setItem('yinyu_chats', JSON.stringify(chats));
    if (currentChatId) renderMessages();
  }, 1000 + Math.random()*1500);
  localStorage.setItem('yinyu_chats', JSON.stringify(chats));
  input.value = '';
  renderMessages();
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

init();
</script>
</body>
</html>
